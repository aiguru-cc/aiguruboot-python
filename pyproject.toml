[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiguruboot"
version = "1.0.0"
description = "Cross-platform, headless Python runtime for AiguruBoot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aiguruboot = "aiguruboot.cli:main"

[tool.setuptools.packages.find]
include = ["aiguruboot*"]

[tool.setuptools.package-data]
aiguruboot = ["resources/*.py", "resources/*.html"]
