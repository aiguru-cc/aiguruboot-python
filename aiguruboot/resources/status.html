<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIGURU Status</title><style>:root{--g:#20c997;--y:#f0b429;--o:#f5785c;--r:#ef4444;--m:#8d919a}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#111827}.page{width:min(718px,calc(100% - 32px));margin:auto;padding:32px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{font-size:24px;color:#526dff;font-weight:700}.actions{display:flex;gap:8px}.actions button{height:38px;padding:0 16px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-weight:600}.actions .icon{width:42px;padding:0}.hero,.card{border:1px solid #e4e7eb;border-radius:10px;overflow:hidden;margin-bottom:24px}.hero{border-color:var(--g)}.hero-head,.hero-body{height:64px;display:flex;align-items:center;padding:18px 16px;gap:10px}.hero-head{background:#d8f8f0}.hero-body{background:#fff}.hero h1{font-size:16px;margin:0}.hero p{font-size:16px;margin:0}.check{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff}.hero.degraded{border-color:var(--o)}.hero.degraded .hero-head{background:#ffe4dc}.hero.degraded .check{background:var(--o)}.hero.major_outage{border-color:var(--r)}.hero.major_outage .hero-head{background:#ffe0e0}.hero.major_outage .check{background:var(--r)}.hero.unknown{border-color:var(--y)}.hero.unknown .hero-head{background:#fff4d6}.hero.unknown .check{background:var(--y)}.head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.head h2{font-size:16px;margin:0}.range{color:var(--m);display:flex;gap:12px}.arrow{cursor:pointer;font-size:25px}.service{padding:15px 22px;border-top:1px solid #f0f1f2}.service-top{display:flex;align-items:center;gap:10px}.service-title{flex:1}.info{width:18px;height:18px;border:2px solid #888;border-radius:50%;display:grid;place-items:center}.uptime{color:var(--m)}.bars{display:grid;grid-template-columns:repeat(90,minmax(4px,1fr));gap:3px;margin-top:16px}.bar{height:12px;border-radius:2px;cursor:help}.green{background:var(--g)}.yellow{background:var(--y)}.orange{background:var(--o)}.red{background:var(--r)}.calendar{padding:0 22px 24px}.week,.dates{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{height:56px;align-items:center;color:var(--m);border-bottom:1px solid #eee}.dates{padding-top:18px;row-gap:12px;font-size:13px}.date{height:42px;display:grid;place-items:center}.muted{color:#d0d0d0}.circle{width:42px;height:42px;justify-self:center;border:3px solid var(--y);border-radius:50%}.circle.orange{border-color:var(--o)}.circle.red{border-color:var(--r)}.tip{position:fixed;z-index:50;min-width:250px;padding:18px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 3px 12px #0002;color:var(--m);font-size:20px;pointer-events:none}.tip strong{display:flex;align-items:center;margin-top:14px;font-weight:400}.tip i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin-right:10px;background:var(--g);color:#fff;font-style:normal}.tip i.y{background:var(--y)}.tip i.o{background:var(--o)}.tip i.r{background:var(--r)}.foot{text-align:center;color:#aaa;font-size:12px;margin-top:28px}</style></head><body><main class="page"><header class="top"><div class="brand">AIGURU</div><div class="actions"><button>订阅更新</button><button class="icon">文</button><button class="icon">☼</button></div></header><section id="hero" class="hero"><div class="hero-head"><span class="check">✓</span><h1 id="headline">一切运行正常</h1></div><div class="hero-body"><p id="subline">所有系统均按预期运行。</p></div></section><section class="card"><div class="head"><h2>系统状态</h2><span id="range">最近90天</span></div><div id="services"></div></section><section class="card"><div class="head"><h2>事件日历</h2><div class="range"><span id="prev" class="arrow">‹</span><span id="month">—</span><span id="next" class="arrow">›</span></div></div><div class="calendar"><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="dates" id="dates"></div></div></section><div class="foot">AIGURU Status · Local Engine</div></main><script>
const $=id=>document.getElementById(id),labels={operational:"运行正常",unknown:"尚未探测",degraded:"性能下降",major_outage:"服务中断"};let offset=0,events=[];
function kind(s){return s==="major_outage"?"red":s==="degraded"?"orange":s==="unknown"?"yellow":"green"}function calendar(){let n=new Date();n.setMonth(n.getMonth()+offset);let first=new Date(n.getFullYear(),n.getMonth(),1).getDay()||7,last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),map=new Map(events.filter(e=>e.status!=="operational").map(e=>[new Date(e.timestamp).toISOString().slice(0,10),e.status])),out="";for(let i=1;i<first;i++)out+=`<span class="date muted">${new Date(n.getFullYear(),n.getMonth(),0).getDate()-first+i+1}</span>`;for(let d=1;d<=last;d++){let key=new Date(n.getFullYear(),n.getMonth(),d).toISOString().slice(0,10),s=map.get(key),c=s?`circle ${kind(s)}`:"";out+=`<span class="date ${c}" data-date="${key}">${d}</span>`}$("dates").innerHTML=out;$("month").textContent=`${n.getFullYear()}年${n.getMonth()+1}月`}
function show(t){document.querySelector(".tip")?.remove();let p=(t.dataset.tip||"暂无事件").split(" · "),s=t.classList.contains("red")?"major_outage":t.classList.contains("orange")?"degraded":t.classList.contains("yellow")?"unknown":"operational",x=document.createElement("div");x.className="tip";x.innerHTML=`<div>${p[0]}</div><strong><i class="${s==="major_outage"?"r":s==="degraded"?"o":s==="unknown"?"y":""}">${s==="operational"?"✓":"!"}</i>${p.slice(2).join(" · ")||"暂无事件"}</strong>`;document.body.appendChild(x);let r=t.getBoundingClientRect();x.style.left=Math.min(innerWidth-x.offsetWidth-10,Math.max(10,r.left))+"px";x.style.top=Math.min(innerHeight-x.offsetHeight-10,r.bottom+8)+"px"}document.addEventListener("mouseover",e=>{let t=e.target.closest(".bar,.date[data-date]");if(t)show(t)});document.addEventListener("mouseout",e=>{if(e.target.closest(".bar,.date[data-date]"))document.querySelector(".tip")?.remove()});prev.onclick=()=>{offset=Math.max(-2,offset-1);calendar()};next.onclick=()=>{offset=Math.min(0,offset+1);calendar()};
async function load(){try{let[a,b]=await Promise.all([fetch("/v1/status",{cache:"no-store"}),fetch("/v1/status/history?days=90",{cache:"no-store"})]),s=await a.json(),h=await b.json();events=s.events||[];let active=events.filter(e=>e.status!=="operational"),state=s.status||"unknown";hero.className="hero "+state;if(active.length){let e=active[0];hero.innerHTML=`<div class="hero-head"><span class="check">!</span><h1>${e.summary||labels[e.status]}</h1></div><div class="hero-body"><p>${labels[e.status]||e.status} · ${new Date(e.timestamp).toLocaleString("zh-CN",{hour12:false})}</p></div>`}$("services").innerHTML=(s.components||[]).map(c=>`<article class="service"><div class="service-top"><span class="check">✓</span><span class="service-title">${c.name}</span><span class="info">i</span><span class="uptime">${h.uptime_percent??"—"}% 可用性</span></div><div class="bars">${(h.data||[]).map(d=>`<i class="bar ${kind(d.status)}" data-tip="${d.date} · ${labels[d.status]||d.status} · ${events.find(e=>new Date(e.timestamp).toISOString().slice(0,10)===d.date)?.summary||"暂无事件"}"></i>`).join("")}</div></article>`).join("");calendar();document.querySelectorAll(".date[data-date]").forEach(d=>{let e=events.find(x=>new Date(x.timestamp).toISOString().slice(0,10)===d.dataset.date);d.dataset.tip=e?`${d.dataset.date} · ${labels[e.status]} · ${e.summary}`:`${d.dataset.date} · 运行正常 · 暂无事件`})}catch(e){headline.textContent="无法取得状态"}}load();setInterval(load,15000);
</script></body></html>
